<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talks on Development Experience</title>
<link rel="icon" href="site-lib/media/favicon.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --card-bg: #f6f8fa;
    --card-border: #d0d7de;
    --accent: #7c5cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #e8eaed;
      --fg-muted: #9aa0a6;
      --card-bg: #2a2b2e;
      --card-border: #3c4043;
      --accent: #a48fff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 42em;
    margin: 0 auto;
    padding: 4em 1.5em 6em;
  }
  h1 {
    font-size: 1.8em;
    margin: 0 0 0.3em;
  }
  .subtitle {
    color: var(--fg-muted);
    margin: 0 0 2.5em;
  }
  ul.articles {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.articles li {
    margin-bottom: 1em;
  }
  ul.articles a {
    display: block;
    padding: 1em 1.25em;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--fg);
    text-decoration: none;
    font-size: 1.05em;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  ul.articles a:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .empty {
    color: var(--fg-muted);
  }
</style>
</head>
<body>
<main>
  <h1>Talks on Development Experience</h1>
  <p class="subtitle">关于开发经验的一些记录与思考</p>
  <ul class="articles" id="article-list">
    <li><a href="寻找工程契约（模块设计）.html">寻找工程契约（模块设计）</a></li>
  </ul>
</main>
<script>
  // 从 Obsidian 导出的 metadata.json 动态读取文章列表；
  // 读取失败时保留上面的静态列表作为兜底。
  fetch("site-lib/metadata.json")
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (meta) {
      var files = (meta.shownInTree || []).filter(function (f) {
        return f.endsWith(".html") && f !== "index.html";
      });
      if (files.length === 0) return;
      var list = document.getElementById("article-list");
      list.innerHTML = "";
      files.forEach(function (f) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = encodeURI(f);
        a.textContent = f.replace(/\.html$/, "");
        li.appendChild(a);
        list.appendChild(li);
      });
    })
    .catch(function () { /* 保留静态兜底列表 */ });
</script>
</body>
</html>
